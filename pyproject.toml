[project]
requires-python = ">=3.14,<3.15"

[tool.ruff]
target-version = "py314"
line-length = 100
# Match pytest's pythonpath so `app` and `ml` are sorted as first-party imports.
src = [".", "backend"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP"
]

[tool.ruff.lint.isort]
# `backend/alembic/` (migrations) would otherwise make Ruff treat the alembic package as first-party.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "backend"
]
testpaths = [
    "backend/tests",
    "ml/tests"
]
markers = [
    "integration: tests requiring external infrastructure (run with `pytest -m integration`)"
]
# Integration tests need Docker; a plain `pytest` run excludes them.
# A later `-m` on the command line (e.g. `pytest -m integration`) overrides this one.
addopts = "-ra -m 'not integration'"
