[project]
requires-python = ">=3.14,<3.15"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP"
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "backend"
]
testpaths = [
    "backend/tests",
    "ml/tests"
]
markers = [
    "integration: tests requiring external infrastructure"
]
addopts = "-ra"