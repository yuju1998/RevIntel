services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    container_name: revintel-postgres

    environment:
      POSTGRES_USER: revintel
      POSTGRES_PASSWORD: revintel
      POSTGRES_DB: revintel

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revintel"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: revintel-redis

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: